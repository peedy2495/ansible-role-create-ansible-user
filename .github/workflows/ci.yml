---
name: CI

"on":
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Ansible lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the role
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install lint tools
        run: python -m pip install ansible-core~=2.14 ansible-lint

      - name: Lint the role
        run: ansible-lint .
