---
- name: Verify that the operating system is supported
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] is defined
      - ansible_facts['distribution'] is defined
      - ansible_facts['os_family'] in ['Debian', 'RedHat']
    fail_msg: >-
      create-ansible-user supports Debian-family and Enterprise Linux-family
      systems only; detected
      {{ ansible_facts['distribution'] | default('an unknown distribution') }}
      (OS family {{ ansible_facts['os_family'] | default('unknown') }}).
    quiet: true

- name: Verify role settings
  ansible.builtin.assert:
    that:
      - create_ansible_user_name is string
      - create_ansible_user_name | trim | length > 0
      - create_ansible_user_name is match('^[a-z_][a-z0-9_-]*$')
      - create_ansible_user_comment is string
      - create_ansible_user_shell is string
      - create_ansible_user_shell | trim | length > 0
      - create_ansible_user_home is string
      - create_ansible_user_home is match('^/[^/].*')
      - create_ansible_user_ssh_public_keys is sequence
      - create_ansible_user_ssh_public_keys is not string
      - create_ansible_user_ssh_public_keys | length > 0
      - create_ansible_user_login_test_enabled | type_debug == 'bool'
      - create_ansible_user_login_test_connect_timeout | int > 0
      - create_ansible_user_login_test_timeout | int > 0
    fail_msg: >-
      Set create_ansible_user_ssh_public_keys to a non-empty list of SSH
      public keys. The username must be a conventional Unix account name, and
      the shell and absolute home path must be non-empty strings.
    quiet: true

- name: Verify SSH public keys
  ansible.builtin.assert:
    that:
      - item is string
      - item | trim | length > 0
      - (item | trim).splitlines() | length == 1
    fail_msg: >-
      Every item in create_ansible_user_ssh_public_keys must contain exactly
      one non-empty public key.
    quiet: true
  loop: "{{ create_ansible_user_ssh_public_keys }}"
  loop_control:
    label: "SSH public key {{ ansible_loop.index }}"
    extended: true

- name: Create the Ansible user's primary group
  ansible.builtin.group:
    name: "{{ create_ansible_user_name }}"
    state: present

- name: Create the Ansible user with a locked password
  ansible.builtin.user:
    name: "{{ create_ansible_user_name }}"
    comment: "{{ create_ansible_user_comment }}"
    group: "{{ create_ansible_user_name }}"
    home: "{{ create_ansible_user_home }}"
    create_home: true
    shell: "{{ create_ansible_user_shell }}"
    password_lock: true
    state: present

- name: Create the Ansible user's SSH directory
  ansible.builtin.file:
    path: "{{ create_ansible_user_home }}/.ssh"
    state: directory
    owner: "{{ create_ansible_user_name }}"
    group: "{{ create_ansible_user_name }}"
    mode: "0700"

- name: Inspect the existing authorized keys before changing them
  ansible.builtin.stat:
    path: "{{ create_ansible_user_home }}/.ssh/authorized_keys"
    follow: true
  register: create_ansible_user_previous_authorized_keys_stat

- name: Save the existing authorized keys before changing them
  ansible.builtin.slurp:
    src: "{{ create_ansible_user_home }}/.ssh/authorized_keys"
  register: create_ansible_user_previous_authorized_keys
  when: create_ansible_user_previous_authorized_keys_stat.stat.exists

- name: Configure and verify access for the Ansible account
  block:
    - name: Install sudo
      ansible.builtin.package:
        name: sudo
        state: present

    - name: Configure authorized SSH keys
      ansible.builtin.lineinfile:
        path: "{{ create_ansible_user_home }}/.ssh/authorized_keys"
        line: "{{ item | trim }}"
        create: true
        owner: "{{ create_ansible_user_name }}"
        group: "{{ create_ansible_user_name }}"
        mode: "0600"
        state: present
      loop: "{{ create_ansible_user_ssh_public_keys }}"
      loop_control:
        label: "SSH public key {{ ansible_loop.index }}"
        extended: true

    - name: Grant the Ansible user passwordless sudo access
      ansible.builtin.copy:
        content: "{{ create_ansible_user_name }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
        dest: "/etc/sudoers.d/{{ create_ansible_user_name }}"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

    - name: Verify the inventory credential through the new Ansible account
      ansible.builtin.include_tasks: verify_login.yml
      vars:
        ansible_user: "{{ create_ansible_user_name }}"
      when:
        - create_ansible_user_login_test_enabled
        - not ansible_check_mode
  rescue:
    - name: Remove SSH keys added by this role run after a failure
      ansible.builtin.lineinfile:
        path: "{{ create_ansible_user_home }}/.ssh/authorized_keys"
        regexp: "^{{ item | trim | regex_escape }}$"
        state: absent
      loop: "{{ create_ansible_user_ssh_public_keys }}"
      loop_control:
        label: "SSH public key {{ ansible_loop.index }}"
        extended: true
      when:
        - >-
          (item | trim) not in
          ((create_ansible_user_previous_authorized_keys.content
            | default('') | b64decode).splitlines())

    - name: Restore previous authorized keys file attributes after a failure
      ansible.builtin.file:
        path: "{{ create_ansible_user_home }}/.ssh/authorized_keys"
        owner: >-
          {{ create_ansible_user_previous_authorized_keys_stat.stat.pw_name
             | default(create_ansible_user_name) }}
        group: >-
          {{ create_ansible_user_previous_authorized_keys_stat.stat.gr_name
             | default(create_ansible_user_name) }}
        mode: >-
          {{ create_ansible_user_previous_authorized_keys_stat.stat.mode
             | default('0600') }}
      when: create_ansible_user_previous_authorized_keys_stat.stat.exists

    - name: Inspect the rolled-back authorized keys file
      ansible.builtin.stat:
        path: "{{ create_ansible_user_home }}/.ssh/authorized_keys"
      register: create_ansible_user_rolled_back_authorized_keys_stat

    - name: Remove an empty authorized keys file created by this role run
      ansible.builtin.file:
        path: "{{ create_ansible_user_home }}/.ssh/authorized_keys"
        state: absent
      when:
        - not create_ansible_user_previous_authorized_keys_stat.stat.exists
        - create_ansible_user_rolled_back_authorized_keys_stat.stat.exists
        - create_ansible_user_rolled_back_authorized_keys_stat.stat.size == 0

    - name: Report the access configuration failure after rollback
      ansible.builtin.fail:
        msg: >-
          Configuring or verifying the Ansible account failed. SSH keys added
          by this run were removed. Original error:
          {{ ansible_failed_result.msg | default('unknown error') }}
